
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <section class="esquerda">

            <img class="logo" src="img/instagram.png" alt="Instagram">

            <h1>
                Veja momentos do dia<br>
                a dia dos seus amigos<br>
                próximos.
            </h1>

            <img class="foto" src="img/insta.png" alt="Momentos do Instagram">

        </section>

        <section class="direita">

            <div class="login">

                <h3>Entrar no Instagram</h3>

                <input type="text" placeholder="Número de celular, nome de usuário ou email">

                <input type="password" placeholder="Senha">

                <button class="entrar">Entrar</button>

                <a href="#" class="esqueceu">Esqueceu a senha?</a>

                <div class="ou"></div>

                <button class="facebook">Entrar com o Facebook</button>

                <button class="criar">Criar nova conta</button>

                <p class="meta">∞ Meta</p>

            </div>

        </section>
    </main>

</body>
</html>
